name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-Tests
        run: node --test tests/unit/*.test.mjs
      - name: Inhalte validieren (falls vorhanden)
        continue-on-error: true
        run: if [ -f tools/validate-content.mjs ] && [ -f content/curriculum.json ]; then node tools/validate-content.mjs; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          [ -d content ] && cp -r content _site/ || true
          mkdir -p _site/tests && cp -r tests/fixtures _site/tests/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
